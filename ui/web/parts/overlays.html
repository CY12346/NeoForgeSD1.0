<div id="sug"></div>
<div id="toast"><span id="toastMsg"></span></div>
<div class="modal" id="libModal">
  <div class="mbox">
    <div class="mhead">
      <h3 id="mTitle">提示词库</h3>
      <input id="libQ" placeholder="搜索中文或英文 tag…" oninput="renderLib()">

    </div>
    <div class="mbody">
      <div class="cats" id="libCats"></div>
      <div class="liblist" id="libList"></div>
    </div>
  </div>
</div>
