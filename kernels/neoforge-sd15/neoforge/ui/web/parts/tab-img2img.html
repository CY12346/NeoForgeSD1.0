<!-- 创作 · 页签二：图生图（img2img） -->
<div id="paneI2I" hidden>
  <div class="row">
    <div><label>源图</label><input id="fSrc" type="file" accept="image/*" onchange="pickSrc(this)"></div>
    <div><label>或</label><div class="note" style="margin-top:6px"><span class="chip" onclick="useStage()">用画布这张</span></div></div>
  </div>
  <div class="note" id="srcNote">未选择源图。</div>
  <label>提示词（描述你想要的结果）</label>
  <textarea id="p2i">masterpiece, best quality, 1girl, penguin hood, mint blue hair, standing in a cornfield, warm afternoon sunlight</textarea>
  <label>反向词</label>
  <input id="n2i" value="lowres, worst quality, low quality, blurry, bad anatomy, extra fingers, text, watermark">
  <label>重绘幅度 denoise：<b id="dnv">0.45</b>　（0.25 微调 / 0.45 半重绘 / 0.7 大改）</label>
  <input id="dn" type="range" min="0.05" max="0.95" step="0.05" value="0.45" oninput="$('dnv').textContent=this.value">
  <div class="row3">
    <div><label>尺寸</label><select id="sizeMode" onchange="toggleSize()"><option value="keep" selected>跟源图一样</option><option value="fixed">指定宽高</option></select></div>
    <div><label>宽</label><input id="w2" type="number" value="512" disabled></div>
    <div><label>高</label><input id="h2" type="number" value="512" disabled></div>
  </div>
  <div class="row3">
    <div><label>缩放方式</label><select id="resizeMode"><option value="0">直接缩放</option><option value="1" selected>裁剪后缩放</option><option value="2">缩放后填充</option></select></div>
    <div><label>步数</label><input id="s2" type="number" value="20"></div>
    <div><label>CFG</label><input id="c2" type="number" step="0.5" value="7"></div>
  </div>
  <div class="row">
    <div><label>张数</label><select id="nq2"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></div>
    <div><label>种子</label><input id="seed2" type="number" value="-1"></div>
  </div>
  <div class="act">
    <button onclick="doEdit()" id="btnEdit">图生图</button>
    <button class="ghost" onclick="editFromCanvas()">用画布这张开跑</button>
  </div>
  <div class="bar"><i id="bar2"></i></div>
  <div class="msg" id="m2"></div>
</div>
